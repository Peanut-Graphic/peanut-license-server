# Dependabot config — Renovate is NOT installed on the Peanut-Graphic GitHub org
# (renovate.json here extends local>peanutgraphic/renovate-config, but nothing
# runs it fleet-wide, so this repo has never received an automated dependency
# PR). This file gives us that coverage until Renovate is actually installed.
#
# Weekly cadence, capped PR counts, and minor/patch grouping are deliberate:
# CI runner capacity is the fleet's binding constraint (8 shared runners).
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "composer"
    groups:
      composer-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    # Majors this frontend's lint toolchain cannot take yet. Both fail `npm install`
    # with ERESOLVE, seen 2026-09-24 on this fleet's own Dependabot PRs:
    #   typescript 7  - typescript-eslint@8 does not support it
    #   eslint 10     - eslint-plugin-jsx-a11y@6 peers eslint <= 9
    # bench-app carries the same two rules. Remove them once those plugins ship
    # support; until then Dependabot re-proposes both every week.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
