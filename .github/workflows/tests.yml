# PHP backend tests + coverage gate.
# Added in Wave 1 of the ecosystem testing scrub — the license/billing backend
# previously had NO PHP CI (the only workflow was frontend accessibility).
# Follows DOCUMENTATION/testing-standard/ci-templates/php-plugin-tests.yml.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Net 2 (security): dependency vulnerability audit. Non-blocking for now
  # (|| true) so a freshly-disclosed advisory in a transitive dep can't wedge
  # the gate; ratchet to blocking once the dep tree is clean and watched.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Dependency audit (composer audit)
        run: composer audit || true

  php-tests:
    needs: security
    runs-on: ubuntu-latest
    env:
      # Coverage floor for the gated Unit suite (tests/phpunit/unit, ~202
      # mock-WordPress tests, no DB). Measured on CI (PHP 8.2 + pcov): 13.66%
      # (729/5336 statements). Floor set ~5 points under that so it catches a
      # real regression while tolerating cross-PHP-version statement-count
      # variance. The coverage-gate step prints the exact "PASS N% (covered/total)"
      # line each run — RATCHET this up as licensing/billing tests are added,
      # toward 20, 30, ... and ultimately the original 40 goal.
      MIN_COVERAGE: "8"
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (pcov for coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Unit tests + coverage (mock-WordPress bootstrap — no DB needed)
        run: vendor/bin/phpunit --testsuite=Unit --coverage-clover=coverage/clover.xml

      - name: Coverage gate
        run: php "${{ github.workspace }}/coverage-gate.php" coverage/clover.xml "$MIN_COVERAGE"

      # Integration suite runs on the same self-contained mock-WordPress
      # bootstrap as the Unit suite (no DB, no real WP test library), so it is a
      # hard gate. If a future Integration test genuinely needs external infra,
      # mock it or mark it skipped rather than reintroducing continue-on-error.
      - name: Integration tests
        run: vendor/bin/phpunit --testsuite=Integration

      # Net 6 (property): seeded-deterministic invariant tests over pure PHP
      # helpers (download-token HMAC, license-key sanitizer/validator, product
      # registry). Same self-contained mock-WP bootstrap, no DB. Hard gate.
      - name: Property tests (net 6 — pure invariants, no DB)
        run: vendor/bin/phpunit --testsuite=Property

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: coverage/
