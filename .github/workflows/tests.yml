# PHP backend tests + coverage gate.
# Added in Wave 1 of the ecosystem testing scrub — the license/billing backend
# previously had NO PHP CI (the only workflow was frontend accessibility).
# Follows DOCUMENTATION/testing-standard/ci-templates/php-plugin-tests.yml.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    env:
      # Conservative coverage floor. The gated Unit suite (tests/phpunit/unit,
      # ~174 mock-WordPress tests, no DB) exercises a subset of the ~25 classes
      # in includes/, so absolute coverage is still modest. The floor is set low
      # on purpose: it must catch a total regression to ~nothing without flaking
      # on cross-PHP-version statement-count variance — it is NOT the real
      # number. The coverage-gate step prints the exact "PASS N% (covered/total)"
      # line each run; read it from the CI log and RATCHET this up from there as
      # licensing/billing tests are added — toward 5, 10, 20, ... and ultimately
      # back to the original 40 goal.
      MIN_COVERAGE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (pcov for coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Unit tests + coverage (mock-WordPress bootstrap — no DB needed)
        run: vendor/bin/phpunit --testsuite=Unit --coverage-clover=coverage/clover.xml

      - name: Coverage gate
        run: php "${{ github.workspace }}/coverage-gate.php" coverage/clover.xml "$MIN_COVERAGE"

      - name: Integration tests (non-blocking until infra wired)
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite=Integration

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: coverage/
