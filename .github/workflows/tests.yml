# PHP backend tests + coverage gate.
# Added in Wave 1 of the ecosystem testing scrub — the license/billing backend
# previously had NO PHP CI (the only workflow was frontend accessibility).
# Follows DOCUMENTATION/testing-standard/ci-templates/php-plugin-tests.yml.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Public runtime floor. PHPUnit 10 itself requires PHP 8.1, so this lane does
  # not resolve development dependencies; it proves every tracked PHP file and
  # the cross-file declaration contract on the exact supported host minimum.
  php-runtime-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          coverage: none
      - name: Verify PHP 8.0 runtime declarations
        run: php scripts/verify-php-runtime.php --expect-runtime=8.0
      - name: Parse every tracked PHP file on PHP 8.0
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

  # Composer's development graph starts at PHP 8.1 because PHPUnit 10 does.
  # Exercise every self-contained mock suite at that exact floor while keeping
  # the existing PHP 8.2 coverage/current lane below.
  php-development-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer
      - name: Install dependencies at the development floor
        run: composer install --no-interaction --prefer-dist
      - name: Verify PHP 8.1 development declarations
        run: php scripts/verify-php-runtime.php --expect-development-runtime=8.1
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite=Unit
      - name: Integration tests
        run: vendor/bin/phpunit --testsuite=Integration
      - name: Property tests
        run: vendor/bin/phpunit --testsuite=Property

  # Net 2 (security): dependency vulnerability audit. Non-blocking for now
  # (|| true) so a freshly-disclosed advisory in a transitive dep can't wedge
  # the gate; ratchet to blocking once the dep tree is clean and watched.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Dependency audit (composer audit)
        run: composer audit || true

      # Net 2 (static): CLASS-007 PHP foot-gun gate. Vendored rule lives at
      # .peanut/static-rules/peanut-php-footguns.yml. BLOCKING (--error): any
      # empty()/!empty() on request input (drops the string "0") or a
      # substr($s, -$n) with a variable length (leaks the whole string when
      # $n == 0) fails the build. The repo was swept to ZERO; keep it there.
      - name: Install semgrep
        run: pip install semgrep
      - name: Semgrep — CLASS-007 foot-guns (blocking)
        run: semgrep --config .peanut/static-rules/peanut-php-footguns.yml includes/ admin/ --error

  php-tests:
    needs: [php-runtime-minimum, php-development-minimum, security]
    runs-on: ubuntu-latest
    env:
      # Coverage floor for the gated Unit suite (tests/phpunit/unit, ~202
      # mock-WordPress tests, no DB). Measured on CI (PHP 8.2 + pcov): 13.66%
      # (729/5336 statements). Floor set ~5 points under that so it catches a
      # real regression while tolerating cross-PHP-version statement-count
      # variance. The coverage-gate step prints the exact "PASS N% (covered/total)"
      # line each run — RATCHET this up as licensing/billing tests are added,
      # toward 20, 30, ... and ultimately the original 40 goal.
      MIN_COVERAGE: "8"
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP (pcov for coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Unit tests + coverage (mock-WordPress bootstrap — no DB needed)
        run: vendor/bin/phpunit --testsuite=Unit --coverage-clover=coverage/clover.xml

      - name: Coverage gate
        run: php "${{ github.workspace }}/coverage-gate.php" coverage/clover.xml "$MIN_COVERAGE"

      # Integration suite runs on the same self-contained mock-WordPress
      # bootstrap as the Unit suite (no DB, no real WP test library), so it is a
      # hard gate. If a future Integration test genuinely needs external infra,
      # mock it or mark it skipped rather than reintroducing continue-on-error.
      - name: Integration tests
        run: vendor/bin/phpunit --testsuite=Integration

      # Net 6 (property): seeded-deterministic invariant tests over pure PHP
      # helpers (download-token HMAC, license-key sanitizer/validator, product
      # registry). Same self-contained mock-WP bootstrap, no DB. Hard gate.
      - name: Property tests (net 6 — pure invariants, no DB)
        run: vendor/bin/phpunit --testsuite=Property

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: coverage/

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Could this be released AT ALL? Read-only: no signing key, no network,
      # nothing published. It proves the artifact the publisher WOULD build is
      # coherent -- version constants that agree with the header, every INCLUDE
      # path present, vendor/ shipped where the build needs it, a changelog
      # entry for this version, and a stable-tag line the publisher's bump can
      # actually match.
      #
      # The checker is synced here from peanut-meta by configs-sync, so this job
      # needs no credential to reach that private repo. Drift is reported by
      # configs-sync and surfaced in the weekly audit. PAR-406.
      - name: Could this be released at all?
        run: bash .peanut/release/verify-release-readiness.sh peanut-license-server
