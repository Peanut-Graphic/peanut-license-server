name: Accessibility CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/accessibility.yml'
      - '.nvmrc'
      - 'scripts/verify-runtime-contract.cjs'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/accessibility.yml'
      - '.nvmrc'
      - 'scripts/verify-runtime-contract.cjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  accessibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Verify Node/npm contract
        working-directory: frontend
        run: test "$(npm --version)" = "10.9.7" && npm run runtime:verify

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run ESLint with jsx-a11y plugin
        working-directory: frontend
        run: |
          npm run lint:a11y

      - name: Run accessibility tests
        working-directory: frontend
        run: npm run test:a11y

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Require non-empty production artifact
        working-directory: frontend
        run: test -s ../assets/dist/js/main.js && test -s ../assets/dist/css/main.css

      # Kept without an upload step. `test:a11y` runs only the a11y subset, so
      # this is the one step here that exercises the FULL suite — the coverage
      # flag is now incidental to that, not the point.
      - name: Run all tests with coverage
        working-directory: frontend
        run: npm run test:coverage
